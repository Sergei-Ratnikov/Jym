plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.meltir.jym'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.meltir.jym"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // === ВАЖНО: это включает использование Java 8+ функций ===
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // === ВАЖНО: это включает ViewBinding (удобная работа с элементами экрана) ===
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // === Базовые библиотеки Android ===
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // === Lifecycle (для ViewModel и LiveData) ===
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // === Navigation Component (для переходов между экранами) ===
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // === Room (база данных SQLite) ===
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // === Fragment ===
    implementation 'androidx.fragment:fragment:1.6.2'

    // === Тесты (можно оставить как есть) ===
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Графики для статистики
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}